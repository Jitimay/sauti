include: package:flutter_lints/flutter.yaml

analyzer:
  # gen-l10n output references the deprecated flutter_localizations delegates;
  # Sauti composes its own material_ui delegates instead (see app/app.dart).
  exclude:
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - cancel_subscriptions
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
