name: sauti
description: "Sauti — AI-powered accessible banking agent. Technology without barriers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  connectivity_plus: ^7.3.2
  equatable: ^3.0.0
  firebase_ai: ^5.1.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  get_it: ^9.3.0
  go_router: ^18.1.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  material_ui: ^1.1.0
  permission_handler: ^13.0.2
  sauti_hybrid_ai:
    path: packages/sauti_hybrid_ai
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  uuid: ^4.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # Atkinson Hyperlegible Next (SIL OFL 1.1, assets/fonts/OFL.txt): designed by
  # the Braille Institute for low-vision readers. Bundled so it works offline.
  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/Atkinson-Regular.ttf
          weight: 400
        - asset: assets/fonts/Atkinson-Medium.ttf
          weight: 500
        - asset: assets/fonts/Atkinson-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Atkinson-Bold.ttf
          weight: 700
        - asset: assets/fonts/Atkinson-ExtraBold.ttf
          weight: 800
