name: sauti_hybrid_ai
description: "Native hybrid inference bridge for Sauti: on-device model first (Apple Foundation Models on iOS), Gemini via Firebase AI Logic as cloud fallback."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SautiHybridAiPlugin
