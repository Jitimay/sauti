name: sauti_hybrid_ai
description: "Hybrid inference bridge for Sauti through Firebase AI Logic: on-device first (Apple Foundation Models on iOS, Gemini Nano on Android and Chrome), cloud Gemini as fallback."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sauti.hybrid_ai
        pluginClass: SautiHybridAiPlugin
      ios:
        pluginClass: SautiHybridAiPlugin
